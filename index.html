Florasight - Plant Identification Interface

Description:
This HTML file provides the structure for Florasight, a web-based plant identification tool. 
It consists of two main panels: 

1. Left Panel - Contains the application logo and control buttons for connecting a camera and identifying plants.
   - .left-panel: Styles the sidebar containing the app controls.
   - .logo-container: Holds the "FLORASIGHT" logo.
   - .button-container: Groups the control buttons.

2. Right Panel - Displays the camera feed and plant information.
   - .right-panel: Styles the main content area.
   - .camera-panel: Houses the live video stream.
   - .stream-container: Contains the <video> and <canvas> elements for real-time plant analysis.
   - .stream-status: Displays the status of the camera feed.
   - .description-panel: Shows identified plant details.
   - .plant-info-container: Holds the plant description.

JavaScript and CSS files are linked externally for interactive features and styling.
-->








<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Florasight - Plant Identification</title>
  <link rel="stylesheet" href="C:\Users\Vans PCs\Desktop\florasight-files\style.css" />
</head>
<body>
  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo-container">
        <div class="logo">FLORASIGHT</div>
      </div>
      <div class="button-container">
        <button id="connectBtn" class="control-btn">Connect</button>
        <button id="identifyBtn" class="control-btn">Identify</button>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="camera-panel">
        <div class="stream-container">
          <video id="videoElement" autoplay playsinline muted></video>
          <canvas id="canvasElement" style="display: none;"></canvas>
          <div class="stream-status">Live Feed</div>
        </div>
      </div>
      <div class="description-panel">
        <h2>Plant Information:</h2>
        <div id="plantInfo" class="plant-info-container">
          <p class="placeholder-text">Connect camera and click 'Identify' to analyze plant</p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="C:\Users\Vans PCs\Desktop\florasight-files\script.js"></script>
</body>
</html>
